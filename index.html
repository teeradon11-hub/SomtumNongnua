<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHUB Expense Lite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#F4F8F4;max-width:700px;margin:auto;padding:16px;color:#1F2937}
.header{margin-bottom:18px}
.title{font-size:28px;font-weight:700;color:#16A34A}
.subtitle{font-size:14px;color:#6B7280;margin-top:4px}
.card{background:white;padding:18px;border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:16px}
.bigCard{background:#22C55E;color:white}
.bigLabel{font-size:14px;opacity:.9}
.bigNumber{font-size:42px;font-weight:700;margin-top:8px}
.compare{font-size:13px;margin-top:8px;opacity:.95}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.label{font-size:14px;color:#6B7280}
.value{font-size:26px;font-weight:700;margin-top:8px}
.stat{background:#F4F8F4;border-radius:16px;padding:12px}
.stat .value{font-size:20px;margin-top:6px}
.note{font-size:13px;color:#6B7280;margin-top:12px;line-height:1.7}
.pos{color:#16A34A}
.neg{color:#DC2626}
.section{font-size:18px;font-weight:700;margin-bottom:16px}
.filterRow{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.chip{padding:10px 16px;background:#DCFCE7;color:#15803D;border-radius:999px;white-space:nowrap;font-size:14px}
.searchBox{width:100%;padding:14px;border:none;outline:none;background:#F3F4F6;border-radius:16px;font-size:15px}
.progress{height:14px;background:#DCFCE7;border-radius:999px;overflow:hidden}
.fill{height:100%;background:#22C55E;border-radius:999px}
.fill2{height:100%;background:#86EFAC;border-radius:999px}
.fillExp{height:100%;background:#FDBA74;border-radius:999px}
.legend{display:flex;gap:16px;font-size:13px;color:#6B7280;margin-bottom:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.monthHead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.barRow{display:flex;align-items:center;gap:8px;font-size:12px;color:#6B7280;margin-bottom:4px}
.barRow .progress{flex:1;height:10px}
.barRow span{width:78px;text-align:right}
.recentItem{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #F3F4F6}
.recentItem:last-child{border-bottom:none}
.recentTitle{font-size:15px;font-weight:600}
.recentCat{font-size:13px;color:#6B7280;margin-top:4px}
.recentAmount{font-size:15px;font-weight:700;color:#16A34A}
</style>
</head>
<body>

<div class="header">
<div class="title">🌿 KHUB Expense Lite</div>
<div class="subtitle">แดชบอร์ดรายรับ-รายจ่ายร้านส้มตำ</div>
</div>

<div class="card bigCard">
<div class="bigLabel">ค่าใช้จ่ายเดือนนี้</div>
<div class="bigNumber" id="monthTotal">฿0</div>
<div class="compare" id="compareText">-</div>
</div>

<div class="grid2">
<div class="card"><div class="label">เดือนก่อน</div><div class="value" id="lastMonth">฿0</div></div>
<div class="card"><div class="label">ปีนี้</div><div class="value" id="yearTotal">฿0</div></div>
</div>

<div id="incomeCard"></div>

<div class="card">
<div class="section">🔍 ค้นหารายการ</div>
<div class="filterRow">
<div class="chip">ทั้งหมด</div><div class="chip">วันนี้</div><div class="chip">7 วัน</div><div class="chip">เดือนนี้</div>
</div>
<div class="filterRow">
<div class="chip">วัตถุดิบ</div><div class="chip">เครื่องดื่ม</div><div class="chip">บรรจุภัณฑ์</div><div class="chip">ค่าใช้จ่ายร้าน</div><div class="chip">อื่นๆ</div>
</div>
<input class="searchBox" placeholder="ค้นหารายการ หรือ ร้านค้า...">
</div>

<div id="topCategory"></div>
<div id="monthlyChart"></div>
<div id="insightCard"></div>
<div id="recentList"></div>

<script>
const SHEET_ID = '10D-GwPgOJ98JU-rTyzonTYsM8Gg6mTzluqy6Q5nJoCA';
const EXPENSE_TAB = 'รวม';
const INCOME_TAB = 'ยอดขาย';

const CACHE_KEY = 'khub_expense_v2';
const CACHE_TTL = 5 * 60 * 1000;

let DATA = [];      // รายจ่าย
let INCOME = [];    // รายรับ (ยอดขายรายวัน)
let incomeError = false;

const thMonth = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function money(n){
  return '฿' + Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
}

function parseAmount(v){
  if(!v) return 0;
  return parseFloat(String(v).replace(/,/g,'')) || 0;
}

function fixYear(y){ return y > 2400 ? y - 543 : y; }

function parseDate(v){
  if(!v) return null;
  const s = String(v).trim();
  let m = s.match(/^Date\((\d+),(\d+),(\d+)/);          // รูปแบบจาก Google: Date(2026,5,3)
  if(m) return new Date(fixYear(+m[1]), +m[2], +m[3]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);          // 2026-06-03
  if(m) return new Date(fixYear(+m[1]), +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);       // 3/6/2026
  if(m) return new Date(fixYear(+m[3]), +m[2]-1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({time:Date.now(), exp:DATA, inc:INCOME}));
  }catch{}
}

function loadCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if(!c || Date.now()-c.time > CACHE_TTL) return null;
    const revive = a => (a||[]).map(x => ({...x, date: x.date ? new Date(x.date) : null}));
    return {exp:revive(c.exp), inc:revive(c.inc)};
  }catch{
    return null;
  }
}

async function fetchTab(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  const res = await fetch(url);
  const txt = await res.text();
  const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
  const cols = json.table.cols.map(c => c.label || '');
  const rows = json.table.rows.map(r => (r.c || []).map(cell => {
    if(!cell) return null;
    const v = cell.v;
    if(typeof v === 'number') return v;
    if(typeof v === 'string' && v.startsWith('Date(')) return v;
    return cell.f ?? v;
  }));
  return {cols, rows};
}

function processExpense(tab){
  const idx = name => tab.cols.indexOf(name);
  const iDate=idx('วันที่'), iAmt=idx('ยอดเงิน'), iCat=idx('หมวดหมู่'), iDet=idx('รายละเอียด'), iShop=idx('ร้านค้า/ผู้รับเงิน');
  return tab.rows.map(r => ({
    date: parseDate(r[iDate]),
    amount: parseAmount(r[iAmt]),
    category: String(r[iCat] || 'อื่นๆ'),
    detail: String(r[iDet] || ''),
    shop: String(r[iShop] || '')
  })).filter(x => x.amount > 0);
}

function processIncome(tab){
  // หาคอลัมน์จากชื่อหัวตาราง ถ้าไม่เจอใช้คอลัมน์ A (วันที่) และ B (ยอดขาย)
  let iDate = tab.cols.indexOf('วันที่');  if(iDate < 0) iDate = 0;
  let iAmt  = tab.cols.indexOf('ยอดขาย'); if(iAmt  < 0) iAmt  = 1;
  return tab.rows.map(r => ({
    date: parseDate(r[iDate]),
    amount: parseAmount(r[iAmt])
  })).filter(x => x.date && x.amount > 0);   // ตารางสรุปด้านขวาไม่มีวันที่ จึงถูกตัดออกเอง
}

function inMonth(x, m, y){
  return x.date && x.date.getMonth() === m && x.date.getFullYear() === y;
}
function sum(a){ return a.reduce((s,x) => s + x.amount, 0); }
function prevMonthOf(m, y){ return m === 0 ? [11, y-1] : [m-1, y]; }

function renderSummary(){
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const [pm, py] = prevMonthOf(m, y);
  const totalMonth = sum(DATA.filter(x => inMonth(x, m, y)));
  const totalPrev  = sum(DATA.filter(x => inMonth(x, pm, py)));
  const totalYear  = sum(DATA.filter(x => x.date && x.date.getFullYear() === y));

  document.getElementById('monthTotal').innerText = money(totalMonth);
  document.getElementById('lastMonth').innerText = money(totalPrev);
  document.getElementById('yearTotal').innerText = money(totalYear);

  const diff = totalMonth - totalPrev;
  document.getElementById('compareText').innerText =
    diff >= 0 ? `▲ เพิ่มขึ้น ${money(diff)}` : `▼ ลดลง ${money(Math.abs(diff))}`;
}

function renderIncome(){
  const box = document.getElementById('incomeCard');
  if(incomeError){
    box.innerHTML = `<div class="card"><div class="section">💰 รายรับเดือนนี้</div>
      <div class="note">โหลดแท็บ “${INCOME_TAB}” ไม่ได้ ตรวจว่าชื่อแท็บถูกต้องและแชร์ชีตแบบ “ทุกคนที่มีลิงก์ดูได้”</div></div>`;
    return;
  }
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const [pm, py] = prevMonthOf(m, y);
  const incRows = INCOME.filter(x => inMonth(x, m, y));
  const inc = sum(incRows);
  const incPrev = sum(INCOME.filter(x => inMonth(x, pm, py)));
  const exp = sum(DATA.filter(x => inMonth(x, m, y)));
  const profit = inc - exp;
  const days = incRows.length;
  const margin = inc > 0 ? Math.round(profit / inc * 100) : 0;
  const diff = inc - incPrev;

  box.innerHTML = `
  <div class="card">
    <div class="section">💰 รายรับเดือนนี้</div>
    <div class="grid3">
      <div class="stat"><div class="label">รายรับ</div><div class="value pos">${money(inc)}</div></div>
      <div class="stat"><div class="label">รายจ่าย</div><div class="value">${money(exp)}</div></div>
      <div class="stat"><div class="label">${profit >= 0 ? 'กำไร' : 'ขาดทุน'}</div>
        <div class="value ${profit >= 0 ? 'pos' : 'neg'}">${money(Math.abs(profit))}</div></div>
    </div>
    <div class="note">
      ${days ? `ขาย ${days} วัน เฉลี่ยวันละ ${money(inc/days)}<br>` : ''}
      ${incPrev ? `เทียบเดือนก่อน: ${diff >= 0 ? '▲ เพิ่มขึ้น' : '▼ ลดลง'} ${money(Math.abs(diff))}<br>` : ''}
      ${inc > 0 ? `กำไรคิดเป็น ${margin}% ของรายรับ` : ''}
    </div>
  </div>`;
}

function renderTopCategory(){
  const box = document.getElementById('topCategory');
  const now = new Date();
  const monthData = DATA.filter(x => inMonth(x, now.getMonth(), now.getFullYear()));
  const cat = {};
  monthData.forEach(x => { cat[x.category] = (cat[x.category] || 0) + x.amount; });
  const arr = Object.entries(cat).sort((a,b) => b[1]-a[1]).slice(0,5);
  const max = arr.length ? arr[0][1] : 1;

  box.innerHTML = `
  <div class="card">
    <div class="section">🔥 Top 5 หมวดค่าใช้จ่าย</div>
    ${arr.map(x => `
    <div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px">
        <div>${x[0]}</div><div>${money(x[1])}</div>
      </div>
      <div class="progress"><div class="fill" style="width:${Math.round(x[1]/max*100)}%"></div></div>
    </div>`).join('')}
  </div>`;
}

function renderMonthlyChart(){
  const box = document.getElementById('monthlyChart');
  const year = new Date().getFullYear();
  const exp = Array(12).fill(0), inc = Array(12).fill(0);
  DATA.forEach(x => { if(x.date && x.date.getFullYear() === year) exp[x.date.getMonth()] += x.amount; });
  INCOME.forEach(x => { if(x.date && x.date.getFullYear() === year) inc[x.date.getMonth()] += x.amount; });

  const max = Math.max(...exp, ...inc, 1);
  const rows = [];
  for(let i = 0; i < 12; i++){
    if(!exp[i] && !inc[i]) continue;
    let profitText;
    if(incomeError) profitText = '';
    else if(!inc[i]) profitText = '<span style="color:#6B7280">ยังไม่มีข้อมูลรายรับ</span>';
    else {
      const p = inc[i] - exp[i];
      profitText = `<span class="${p >= 0 ? 'pos' : 'neg'}">${p >= 0 ? 'กำไร' : 'ขาดทุน'} ${money(Math.abs(p))}</span>`;
    }
    rows.push(`
    <div style="margin-bottom:18px">
      <div class="monthHead"><b>${thMonth[i]}</b><div>${profitText}</div></div>
      <div class="barRow"><div class="progress"><div class="fill" style="width:${Math.round(inc[i]/max*100)}%"></div></div><span>${money(inc[i])}</span></div>
      <div class="barRow"><div class="progress"><div class="fillExp" style="width:${Math.round(exp[i]/max*100)}%"></div></div><span>${money(exp[i])}</span></div>
    </div>`);
  }

  box.innerHTML = `
  <div class="card">
    <div class="section">📊 รายรับ-รายจ่ายรายเดือน</div>
    <div class="legend">
      <div><span class="dot" style="background:#22C55E"></span>รายรับ</div>
      <div><span class="dot" style="background:#FDBA74"></span>รายจ่าย</div>
    </div>
    ${rows.join('')}
  </div>`;
}

function renderInsight(){
  const box = document.getElementById('insightCard');
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const [pm, py] = prevMonthOf(m, y);
  const diff = sum(DATA.filter(x => inMonth(x, m, y))) - sum(DATA.filter(x => inMonth(x, pm, py)));
  const message = diff > 0
    ? `เดือนนี้ใช้เพิ่มขึ้น ${money(diff)} เมื่อเทียบกับเดือนก่อน`
    : `เดือนนี้ใช้ลดลง ${money(Math.abs(diff))} เมื่อเทียบกับเดือนก่อน`;

  box.innerHTML = `
  <div class="card">
    <div class="section">⚠️ สิ่งที่ควรดู</div>
    <div style="line-height:1.9;color:#166534;font-size:16px">${message}</div>
  </div>`;
}

function itemHtml(x){
  return `
  <div class="recentItem">
    <div>
      <div class="recentTitle">${x.detail || x.shop}</div>
      <div class="recentCat">${x.category}</div>
    </div>
    <div class="recentAmount">${money(x.amount)}</div>
  </div>`;
}

function renderRecent(){
  const recent = [...DATA].sort((a,b) => (b.date||0) - (a.date||0)).slice(0,10);
  document.getElementById('recentList').innerHTML = `
  <div class="card">
    <div class="section">🕒 10 รายการล่าสุด</div>
    ${recent.map(itemHtml).join('')}
  </div>`;
}

function renderAll(){
  renderSummary();
  renderIncome();
  renderTopCategory();
  renderMonthlyChart();
  renderInsight();
  renderRecent();
}

async function loadData(){
  const cache = loadCache();
  if(cache){
    DATA = cache.exp;
    INCOME = cache.inc;
    renderAll();
  }

  try{
    DATA = processExpense(await fetchTab(EXPENSE_TAB));
  }catch(err){
    console.log('expense', err);
  }

  try{
    INCOME = processIncome(await fetchTab(INCOME_TAB));
    incomeError = false;
  }catch(err){
    console.log('income', err);
    incomeError = true;
  }

  saveCache();
  renderAll();
}

loadData();
setInterval(loadData, 5*60*1000);

document.querySelector('.searchBox').addEventListener('input', function(){
  const keyword = this.value.toLowerCase().trim();
  if(!keyword){ renderRecent(); return; }

  const result = DATA.filter(x =>
    (x.detail || '').toLowerCase().includes(keyword) ||
    (x.shop || '').toLowerCase().includes(keyword)
  ).slice(0,20);

  document.getElementById('recentList').innerHTML = `
  <div class="card">
    <div class="section">🔍 ผลการค้นหา</div>
    ${result.map(itemHtml).join('')}
  </div>`;
});
</script>

</body>
</html>
